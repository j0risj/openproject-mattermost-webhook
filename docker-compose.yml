services:
  op-mm-bridge:
    build: .
    environment:
      MATTERMOST_WEBHOOK_URL: "https://mattermost.example.com/hooks/xxxxx"
      OPENPROJECT_BASE_URL: "https://openproject.example.com"
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.op-bridge.rule=PathPrefix(`/`)
      - traefik.http.routers.op-bridge.entrypoints=websecure
      - traefik.http.routers.op-bridge.tls=true
      - traefik.http.services.op-bridge.loadbalancer.server.port=8080

  traefik:
    image: traefik:v3.7
    ports:
      - "80:80"
      - "443:443"
    environment:
      TRAEFIK_PROVIDERS_DOCKER: "true"
      TRAEFIK_PROVIDERS_DOCKER_EXPOSEDBYDEFAULT: "false"
      TRAEFIK_PROVIDERS_FILE_FILENAME: /etc/traefik/dynamic.yml
      TRAEFIK_PROVIDERS_FILE_WATCH: "true"
      TRAEFIK_ENTRYPOINTS_WEB_ADDRESS: ":80"
      TRAEFIK_ENTRYPOINTS_WEBSECURE_ADDRESS: ":443"
      TRAEFIK_ENTRYPOINTS_WEB_HTTP_REDIRECTIONS_ENTRYPOINT_TO: websecure
      TRAEFIK_ENTRYPOINTS_WEB_HTTP_REDIRECTIONS_ENTRYPOINT_SCHEME: https
    entrypoint:
      - sh
      - -c
      - |
        printf 'tls:\n  certificates:\n    - certFile: /etc/traefik/certs/fullchain.pem\n      keyFile: /etc/traefik/certs/privkey.pem\n' > /etc/traefik/dynamic.yml
        exec traefik
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./certs:/etc/traefik/certs:ro
    depends_on:
      - op-mm-bridge
    restart: unless-stopped
