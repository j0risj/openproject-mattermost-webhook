services:
  op-mm-bridge:
    build: .
    environment:
      MATTERMOST_WEBHOOK_URL: "https://mattermost.example.com/hooks/xxxxx"
      OPENPROJECT_BASE_URL: "https://openproject.example.com"
    restart: unless-stopped
    expose:
      - "8080"

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      CERT_FILE: /etc/caddy/certs/fullchain.pem
      KEY_FILE: /etc/caddy/certs/privkey.pem
      UPSTREAM: op-mm-bridge:8080
    entrypoint:
      - sh
      - -c
      - |
        printf '{
          auto_https off
        }
        :443 {
          tls {$CERT_FILE} {$KEY_FILE}
          reverse_proxy {$UPSTREAM}
        }
        :80 {
          redir https://{host}{uri} 301
        }
        ' | caddy run --config - --adapter caddyfile
    volumes:
      - ./certs:/etc/caddy/certs:ro
    depends_on:
      - op-mm-bridge
    restart: unless-stopped
