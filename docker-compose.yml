services:
  op-mm-bridge:
    build: .
    environment:
      MATTERMOST_WEBHOOK_URL: "https://mattermost.example.com/hooks/xxxxx"
      OPENPROJECT_BASE_URL: "https://openproject.example.com"
    restart: unless-stopped
    expose:
      - "8080"

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      CERT_FILE: /etc/caddy/certs/fullchain.pem
      KEY_FILE: /etc/caddy/certs/privkey.pem
      UPSTREAM: op-mm-bridge:8080
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/etc/caddy/certs:ro
    depends_on:
      - op-mm-bridge
    restart: unless-stopped
